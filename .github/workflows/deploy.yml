name: Deploy HalaElNile to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Detect Hostinger web root & prepare directories
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          BASE_DIR=$(sshpass -p "$SSH_PASS" ssh -p 65002 -o StrictHostKeyChecking=no u261198647@185.224.138.10 '
            if [ -d "/home/u261198647/domains/halaelnile.com/public_html" ]; then
              echo "/home/u261198647/domains/halaelnile.com"
            else
              echo "/home/u261198647"
            fi
          ' | tr -d '\r\n')
          echo "BASE_DIR=$BASE_DIR" >> $GITHUB_ENV
          echo "Detected BASE_DIR: $BASE_DIR"

          sshpass -p "$SSH_PASS" ssh -p 65002 -o StrictHostKeyChecking=no u261198647@185.224.138.10 "
            mkdir -p $BASE_DIR/Project/storage/app/public \
                     $BASE_DIR/Project/storage/app/private \
                     $BASE_DIR/Project/storage/framework/cache/data \
                     $BASE_DIR/Project/storage/framework/sessions \
                     $BASE_DIR/Project/storage/framework/views \
                     $BASE_DIR/Project/storage/logs \
                     $BASE_DIR/Project/bootstrap/cache \
                     $BASE_DIR/public_html
            if [ \"$BASE_DIR\" != \"/home/u261198647\" ] && [ -d \"/home/u261198647/Project/storage/app/public\" ]; then
              cp -rn /home/u261198647/Project/storage/app/public/. $BASE_DIR/Project/storage/app/public/ || true
            fi
          "

      - name: Sync Laravel Project files to Project folder
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='public' \
            --exclude='storage' \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            ./ u261198647@185.224.138.10:${{ env.BASE_DIR }}/Project/

      - name: Sync public storage images (if any in repo, without deleting server uploads)
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -d "./storage/app/public" ]; then
            sshpass -p "$SSH_PASS" rsync -avz \
              --exclude='.gitignore' \
              -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
              ./storage/app/public/ u261198647@185.224.138.10:${{ env.BASE_DIR }}/Project/storage/app/public/
          fi

      - name: Sync public assets to public_html
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            --exclude='storage' \
            --exclude='index.php' \
            --exclude='hot' \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            ./public/ u261198647@185.224.138.10:${{ env.BASE_DIR }}/public_html/

      - name: Configure index.php, storage symlink, .env & Laravel caches on server
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BASE_DIR: ${{ env.BASE_DIR }}
        run: |
          DB_DATABASE_B64=$(printf '%s' "$DB_DATABASE" | base64 -w0)
          DB_USERNAME_B64=$(printf '%s' "$DB_USERNAME" | base64 -w0)
          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD" | base64 -w0)

          sshpass -p "$SSH_PASS" ssh -p 65002 -o StrictHostKeyChecking=no u261198647@185.224.138.10 "bash -s '$BASE_DIR' '$DB_DATABASE_B64' '$DB_USERNAME_B64' '$DB_PASSWORD_B64'" << 'ENDSSH'
          set -e

          BASE_DIR="$1"
          DB_DATABASE=$(printf '%s' "$2" | base64 -d)
          DB_USERNAME=$(printf '%s' "$3" | base64 -d)
          DB_PASSWORD=$(printf '%s' "$4" | base64 -d)

          # 1. Write public_html/index.php linked to ../Project
          cat > "$BASE_DIR/public_html/index.php" << 'EOF'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = __DIR__.'/../Project/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require __DIR__.'/../Project/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once __DIR__.'/../Project/bootstrap/app.php';
          $app->usePublicPath(__DIR__);

          $app->handleRequest(Request::capture());
          EOF

          # 2. Link public_html/storage -> Project/storage/app/public
          ln -sfn "$BASE_DIR/Project/storage/app/public" "$BASE_DIR/public_html/storage"

          # 3. Create or update .env
          cd "$BASE_DIR/Project"
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          update_env() {
            local key="$1"
            local val="$2"
            /usr/bin/php -r '
              $file = ".env";
              $content = file_get_contents($file);
              $key = $argv[1];
              $val = $argv[2];
              $safeVal = "\"" . addcslashes($val, "\"\\$") . "\"";
              if (preg_match("/^" . preg_quote($key, "/") . "=/m", $content)) {
                  $content = preg_replace("/^" . preg_quote($key, "/") . "=.*/m", $key . "=" . $safeVal, $content);
              } elseif (preg_match("/^#\s*" . preg_quote($key, "/") . "=/m", $content)) {
                  $content = preg_replace("/^#\s*" . preg_quote($key, "/") . "=.*/m", $key . "=" . $safeVal, $content);
              } else {
                  $content .= PHP_EOL . $key . "=" . $safeVal . PHP_EOL;
              }
              file_put_contents($file, $content);
            ' "$key" "$val"
          }

          update_env "APP_NAME" "Hala ElNile"
          update_env "APP_ENV" "production"
          update_env "APP_DEBUG" "false"
          update_env "APP_URL" "https://halaelnile.com"
          update_env "DB_CONNECTION" "mysql"
          update_env "DB_HOST" "127.0.0.1"
          update_env "DB_PORT" "3306"

          if [ -n "$DB_DATABASE" ]; then
            update_env "DB_DATABASE" "$DB_DATABASE"
          fi
          if [ -n "$DB_USERNAME" ]; then
            update_env "DB_USERNAME" "$DB_USERNAME"
          fi
          if [ -n "$DB_PASSWORD" ]; then
            update_env "DB_PASSWORD" "$DB_PASSWORD"
          fi

          if grep -q "^APP_KEY=$" .env; then
            /usr/bin/php artisan key:generate --force
          fi

          # 4. Permissions & Artisan optimization
          chmod -R 775 storage bootstrap/cache
          /usr/bin/php artisan migrate --force
          /usr/bin/php artisan optimize:clear
          /usr/bin/php artisan config:cache
          /usr/bin/php artisan route:cache
          /usr/bin/php artisan view:cache
          ENDSSH
