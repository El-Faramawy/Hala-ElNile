<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 95" width="100%" height="100%">
  <defs>
    <!-- Logo Gold Gradients -->
    <linearGradient id="hdrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2"/>
      <stop offset="35%" stop-color="#f5c242"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a67c1e"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="30%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="hdrGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b050"/>
      <stop offset="100%" stop-color="#008037"/>
    </linearGradient>
    <linearGradient id="hdrRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ce2b37"/>
    </linearGradient>
    <filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Shield Emblem -->
  <g transform="translate(6, 6)" filter="url(#hdrGlow)">
    <!-- Outer Shield -->
    <path d="M 42,4 L 75,17 C 75,52 42,78 42,80 C 42,78 9,52 9,17 Z" fill="#0b1b33" stroke="url(#hdrGold)" stroke-width="2.5"/>
    
    <!-- Italian flag arcs -->
    <path d="M 23,28 Q 42,19 61,28" fill="none" stroke="url(#hdrGreen)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 26,34 Q 42,25 58,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 29,40 Q 42,31 55,40" fill="none" stroke="url(#hdrRed)" stroke-width="3" stroke-linecap="round"/>

    <!-- Gold Wing / Compass Star -->
    <path d="M 42,34 L 45,43 L 55,44 L 47,51 L 50,61 L 42,55 L 34,61 L 37,51 L 29,44 L 39,43 Z" fill="url(#hdrGold)"/>
  </g>

  <!-- Typography: هلا النيل (Brand Title in Luxury Gold for Dark Backgrounds) -->
  <g transform="translate(98, 12)">
    <!-- Brand Title: Golden Yellow, highly visible on dark backgrounds -->
    <text x="0" y="38" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="36" fill="url(#goldText)" letter-spacing="-0.5" filter="url(#textGlow)">
      هلا النيل
    </text>
    
    <!-- Subtitle: Italian Green -->
    <text x="2" y="58" font-family="'Cairo', sans-serif" font-weight="700" font-size="13" fill="#22c55e">
      لإلحاق العمالة المصرية بالخارج
    </text>
    
    <!-- Latin Brand & Specialization Tag -->
    <text x="3" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" fill="#cbd5e1" letter-spacing="1.2">
      HALA AL-NILE • ITALY RECRUITMENT
    </text>
  </g>
</svg>
